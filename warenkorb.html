<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Warenkorb | ADIRONDUCK</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css"></head>
<body data-page="warenkorb">
<main>
<div class="ph mint"><div><h1>Ihr Warenkorb</h1><p style="color:var(--mu);margin-top:10px">Hier sehen Sie Ihre ausgewählten Produkte.</p></div></div>
<section class="sec" style="max-width:960px"><h2>Ihre <em>Artikel</em></h2><div id="list"></div><div id="sum"></div></section>
</main>
<script src="assets/common.js"></script>
<script>
function draw(){
  const l=$('#list'),s=$('#sum');
  if(!CART.length){l.innerHTML='<div class="empty">Ihr Warenkorb ist leer.<br><br><a class="btn" href="shop.html">Zum Shop</a></div>';s.innerHTML='';return}
  l.innerHTML=CART.map((i,n)=>`<div class="ci"><img alt="" src="${i.thumb||''}"><div><b>${i.name}</b><small>${info(i.cfg)}</small><small>${eur(calc(i.cfg))} pro Stück</small></div><div class="q"><button data-q="${n}" data-d="-1" aria-label="Weniger">−</button>${i.qty}<button data-q="${n}" data-d="1" aria-label="Mehr">+</button></div><div style="text-align:right"><b>${eur(calc(i.cfg)*i.qty)}</b><br><button class="x" data-rm="${n}" aria-label="Entfernen">✕</button></div></div>`).join('');
  const t=CART.reduce((a,i)=>a+calc(i.cfg)*i.qty,0);
  s.innerHTML=`<div class="sum"><div class="row" style="margin:0"><span>Zwischensumme</span><span>${eur(t)}</span></div><div class="row" style="margin:6px 0"><span>Lieferung</span><span>kostenlos</span></div><div class="tot"><span>Gesamt</span><b>${eur(t)}</b></div><button class="btn" id="co" style="width:100%">Zur Kasse</button><button class="btn l" id="clr" style="width:100%;margin-top:10px">Warenkorb leeren</button></div>`;
  $('#co').onclick=()=>{CART=[];saveCart();draw();toast('Danke! Das ist ein Demo-Shop, es wurde nichts bestellt.')};
  $('#clr').onclick=()=>{CART=[];saveCart();draw()};
}
$('#list').onclick=e=>{
  const q=e.target.closest('[data-q]'),r=e.target.closest('[data-rm]');
  if(q){const i=CART[+q.dataset.q];i.qty+=+q.dataset.d;if(i.qty<1)CART.splice(+q.dataset.q,1)}
  if(r)CART.splice(+r.dataset.rm,1);
  saveCart();draw();
};
draw();
</script>
</body></html>
